name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic identification for every artefact this workflow produces.
  SHA_SHORT: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build, typecheck, unit tests. Fast gate: nothing else runs until this
  #    is green.
  # ---------------------------------------------------------------------------
  build-typecheck-test:
    name: build / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --workspaces

      - name: Typecheck
        run: npm run typecheck --workspaces

      - name: Unit tests
        run: npm run test --workspaces

      # ops/ is data + scripts, so a "does it still parse / do the names still
      # exist" check is the only meaningful gate. Catches a renamed metric that
      # would otherwise leave an alert or a dashboard panel silently empty.
      - name: Validate ops assets (alerts, dashboard, metric references)
        run: python3 ops/scripts/validate-ops.py

      - name: Prometheus rule syntax check
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/ops:/work:ro" \
            prom/prometheus:v3.0.0 \
            check config /work/prometheus.yml

      - name: PowerShell syntax check (ops/scripts)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          Get-ChildItem ops/scripts/*.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName):: $($errors.Count) parse error(s)"
              $errors | Select-Object -First 3 | ForEach-Object { Write-Host "  $_" }
              $bad++
            } else {
              Write-Host "ok $($_.Name)"
            }
          }
          if ($bad -gt 0) { throw "$bad script(s) failed to parse" }

  # ---------------------------------------------------------------------------
  # 2. Boot the real server and prove it serves: smoke test + 20-bot soak,
  #    uploading every CSV/JSON/log artefact.
  # ---------------------------------------------------------------------------
  smoke-and-soak:
    name: smoke + 20-bot soak
    needs: build-typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PORT: '8081'
      METRICS_PORT: '9090'
      CONTROL_PORT: '9190'
      # Structured JSON logs: the smoke test greps for drain-begin/drain-complete.
      LOG_JSON: '1'
      MAX_PLAYERS_PER_SHARD: '500'
      AETHERFALL_VERSION: '0.1.0-ci'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --workspaces

      - name: Boot the shard (background)
        run: |
          New-Item -ItemType Directory -Force -Path .ops/run, .ops/soak | Out-Null
          $p = Start-Process node -ArgumentList 'server/dist/index.js' `
                 -WorkingDirectory $PWD -PassThru -NoNewWindow `
                 -RedirectStandardOutput .ops/run/shard-0.log `
                 -RedirectStandardError  .ops/run/shard-0.err.log
          Set-Content .ops/run/shard-0.pid $p.Id
          Write-Host "server pid=$($p.Id)"
          # Readiness poll so a slow runner does not turn into a flaky failure.
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline) {
            try {
              $h = Invoke-RestMethod http://localhost:9090/healthz -TimeoutSec 2
              if ($h.ok) { Write-Host "ready tick=$($h.tick) control=$($h.controlPort)"; exit 0 }
            } catch { }
            Start-Sleep -Milliseconds 300
          }
          Write-Host '::error::server never became ready'
          Get-Content .ops/run/shard-0.err.log -ErrorAction SilentlyContinue
          exit 1

      - name: Smoke test (health + metrics + join + drain)
        run: |
          # -SkipKill: the soak needs a live server, so the drain stage is run
          # separately below after the soak finishes.
          ./ops/scripts/smoke-test.ps1 -Port 8081 -MetricsPort 9090 `
            -ControlPort 9190 -ShardId shard-0 `
            -SnapshotFile .ops/soak/metrics-after-smoke.txt -SkipKill

      # A dead shard used to surface only as downstream ECONNREFUSED with no
      # evidence in the job log (artefacts need a login to download). Dump the
      # process state and both shard logs here so the next failure is
      # diagnosable from the log output alone.
      - name: Dump shard diagnostics on smoke failure
        if: failure()
        run: |
          node --version
          Get-Process node -ErrorAction SilentlyContinue | Select-Object Id, StartTime, WorkingSet64
          Write-Host '--- shard-0.err.log (stderr: crash stacks land here) ---'
          Get-Content .ops/run/shard-0.err.log -ErrorAction SilentlyContinue
          Write-Host '--- shard-0.log tail (last 40 lines) ---'
          Get-Content .ops/run/shard-0.log -Tail 40 -ErrorAction SilentlyContinue

      - name: Soak (20 bots)
        run: |
          ./ops/scripts/soak.ps1 -Bots 20 -Duration 30 -Label ci `
            -OutDir .ops/soak -Server ws://localhost:8081 `
            -MaxFailRate 0.1 -MaxTickGaps 0 -MinSnapshotsPerBot 5

      - name: Drain the shard and assert a clean shutdown
        if: always()
        run: |
          try {
            $r = Invoke-RestMethod -Method Post http://localhost:9190/drain -TimeoutSec 5
            Write-Host "drain accepted: $($r | ConvertTo-Json -Compress)"
          } catch {
            Write-Host "drain request failed (server may already be gone): $_"
          }
          # The drain is ordered and must complete well inside its 5s budget.
          Start-Sleep -Seconds 3
          $log = Get-Content .ops/run/shard-0.log -Raw -ErrorAction SilentlyContinue
          if (-not $log) { throw 'no shard log' }
          foreach ($needle in 'drain-begin', 'drain-complete') {
            if ($log -notmatch $needle) { throw "drain event '$needle' missing from the log" }
          }
          if ($log -match '"timedOut":true') { throw 'drain timed out' }
          Write-Host 'clean shutdown verified (drain-begin + drain-complete, no timeout)'

      - name: Upload smoke + soak artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-shard0-run${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ops/soak/*.csv
            .ops/soak/*.json
            .ops/soak/*.txt
            .ops/run/*.log
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Versioned tarballs for tagged releases and manual runs.
  # ---------------------------------------------------------------------------
  release:
    name: release
    needs: [build-typecheck-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: ver
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { '' }
          $sha = $env:GITHUB_SHA.Substring(0, 8)
          $version = if ($tag) { $tag.TrimStart('v') } else { "$($pkg.version)-dev.$sha" }
          "version=$version"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "base=aetherfall-$version-$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$version tag=$tag"

      - name: Install + build
        run: |
          npm ci
          npm run build --workspaces

      - name: Package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.ver.outputs.base }}"
          staging="dist-pkg/$base"
          mkdir -p "$staging"

          # Runtime payload: compiled output + the sources it was built from,
          # plus the ops/runbook surface an operator needs on the box.
          for d in shared engine server client tools; do
            [ -d "$d/dist" ] && cp -r "$d/dist" "$staging/$d-dist"
          done
          cp -r ops "$staging/ops"
          cp package.json package-lock.json tsconfig.base.json README.md LICENSE* "$staging" 2>/dev/null || true
          for d in docs; do cp -r "$d" "$staging/docs"; done

          # Provenance: exact toolchain + the commit the artefact came from.
          node -v > "$staging/BUILD-INFO.txt"
          npm -v >> "$staging/BUILD-INFO.txt"
          git rev-parse HEAD >> "$staging/BUILD-INFO.txt"
          git log -1 --format='%h %s' >> "$staging/BUILD-INFO.txt"

          mkdir -p dist-pkg/out
          tar -czf "dist-pkg/out/$base.tar.gz" -C dist-pkg "$base"
          ( cd dist-pkg/out && sha256sum "$base.tar.gz" > "$base.tar.gz.sha256" )
          echo "base=$base" >> "$env:GITHUB_OUTPUT"
          echo "archive=dist-pkg/out/$base.tar.gz" >> "$env:GITHUB_OUTPUT"
          ls -l dist-pkg/out

      - name: Upload tarballs
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.base }}
          path: |
            dist-pkg/out/*.tar.gz
            dist-pkg/out/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-pkg/out/*.tar.gz
            dist-pkg/out/*.sha256
          generate_release_notes: true
          body: |
            AETHERFALL release. Each tarball carries `ops/` (prometheus, alerts,
            Grafana dashboard, start/stop shards, smoke + soak scripts) and
            `BUILD-INFO.txt` with the exact node/npm versions and commit.
            Verify with `sha256sum -c *.sha256` after download.

      - name: Summary
        run: |
          {
            echo '### release artefact'
            echo
            echo '```'
            cat dist-pkg/out/*.sha256
            echo '```'
          } >> $env:GITHUB_STEP_SUMMARY