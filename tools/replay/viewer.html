<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AETHERFALL replay viewer</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0b0e14; color: #dbe2ef; margin: 16px; }
  #bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  #layout { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  canvas { background: #101623; border: 1px solid #2a3a55; }
  #meta { font-size: 12px; opacity: 0.85; min-width: 280px; }
  #events { font-size: 12px; max-height: 600px; overflow-y: auto; border: 1px solid #2a3a55;
            padding: 6px 8px; min-width: 260px; max-width: 340px; background: #0e1420; }
  #events div { margin: 2px 0; border-bottom: 1px solid #1a2436; padding-bottom: 2px; }
  button, select { padding: 4px 10px; }
  input[type=range] { width: 420px; }
  kbd { background: #1a2436; border: 1px solid #2a3a55; border-radius: 3px; padding: 0 4px; font-size: 11px; }
  .hint { font-size: 11px; opacity: 0.7; }
</style>
</head>
<body>
<h2>AETHERFALL replay viewer</h2>
<div id="bar">
  <input type="file" id="file" accept=".ndjson,.jsonl,.json" />
  <button id="play">play</button>
  <button id="stepB" title="previous frame (←)">⏮</button>
  <button id="stepF" title="next frame (→)">⏭</button>
  <label>speed <select id="speed">
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
  </select></label>
  <label><input type="checkbox" id="loop" /> loop</label>
  <label>follow <select id="follow"><option value="">— all —</option></select></label>
  <input type="range" id="scrub" min="0" max="0" value="0" />
  <span id="meta">load a .ndjson recording from tools/replay/recordings/</span>
</div>
<div id="layout">
  <canvas id="cv" width="800" height="600"></canvas>
  <div id="events"><b>events</b><div class="hint">record with <kbd>--all</kbd> to include chat + event lines</div></div>
</div>
<p class="hint">shortcuts: <kbd>space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> step frame ·
<kbd>home</kbd>/<kbd>end</kbd> first/last frame</p>
<script>
// .ndjson line format: { "t": <ms>, "msg": <ServerMsg> }
// World: 100x100 arena -> canvas 800x600 (x*8, y*6).
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const scrub = document.getElementById('scrub');
const meta = document.getElementById('meta');
const eventBox = document.getElementById('events');
const followSel = document.getElementById('follow');
const speedSel = document.getElementById('speed');
const loopBox = document.getElementById('loop');
let frames = []; // {t, entities:[{id,kind,p:{x,y},hp,maxHp,name}]}
let events = []; // {t, frameIdx, text}
let playing = false;
let idx = 0;
let timer = null;
const SX = 8, SY = 6; // arena 100x100 -> 800x600
const TRAIL = 20;
const trails = new Map(); // id -> [{x,y}] ring buffer

function pushTrail(e) {
  let tr = trails.get(e.id);
  if (!tr) { tr = []; trails.set(e.id, tr); }
  tr.push({ x: e.p.x, y: e.p.y });
  if (tr.length > TRAIL) tr.shift();
}

function drawGrid() {
  ctx.strokeStyle = '#1a2436';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#5a6b8c';
  ctx.font = '9px system-ui';
  for (let u = 0; u <= 100; u += 10) {
    ctx.beginPath(); ctx.moveTo(u * SX, 0); ctx.lineTo(u * SX, 600); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, u * SY); ctx.lineTo(800, u * SY); ctx.stroke();
    ctx.fillText(String(u), u * SX + 2, 10);
  }
}

function draw(i) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawGrid();
  ctx.strokeStyle = '#2a3a55';
  ctx.strokeRect(0, 0, 800, 600);
  const f = frames[i];
  if (!f) return;
  const followId = followSel.value === '' ? null : Number(followSel.value);
  let players = 0, mobs = 0;
  for (const e of f.entities) {
    if (e.kind === 'player') players++; else mobs++;
    const x = Math.max(0, Math.min(100, e.p.x)) * SX;
    const y = Math.max(0, Math.min(100, e.p.y)) * SY;
    // trail
    const tr = trails.get(e.id);
    if (tr && tr.length > 1) {
      ctx.strokeStyle = e.kind === 'player' ? 'rgba(90,169,255,0.35)' : 'rgba(255,122,90,0.35)';
      ctx.beginPath();
      tr.forEach((p, k) => {
        const px = p.x * SX, py = p.y * SY;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();
    }
    const hl = followId === e.id;
    ctx.beginPath();
    ctx.arc(x, y, hl ? 9 : 6, 0, Math.PI * 2);
    ctx.fillStyle = e.kind === 'player' ? '#5aa9ff' : '#ff7a5a';
    ctx.fill();
    if (hl) { ctx.strokeStyle = '#ffd75a'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1; }
    const w = 16 * Math.max(0, e.hp / (e.maxHp || 100));
    ctx.fillStyle = '#3ddc84';
    ctx.fillRect(x - 8, y - 12, w, 3);
    if (e.name) {
      ctx.fillStyle = '#aeb9cf';
      ctx.font = '10px system-ui';
      ctx.fillText(String(e.name).slice(0, 12), x + 8, y + 3);
    }
  }
  const secs = (f.t / 1000).toFixed(1);
  meta.textContent = `frame ${i + 1}/${frames.length} t=${f.t}ms (${secs}s) ` +
    `entities=${f.entities.length} (players ${players}, mobs ${mobs})`;
  scrub.value = i;
  // events up to this frame (last 30)
  const ev = events.filter((e) => e.frameIdx <= i).slice(-30);
  eventBox.innerHTML = '<b>events</b>';
  for (const e of ev) {
    const d = document.createElement('div');
    d.textContent = `[${(e.t / 1000).toFixed(1)}s] ${e.text}`;
    eventBox.appendChild(d);
  }
  eventBox.scrollTop = eventBox.scrollHeight;
}

function refreshFollowOptions() {
  const seen = new Map();
  for (const f of frames)
    for (const e of f.entities)
      if (!seen.has(e.id)) seen.set(e.id, e.name || `${e.kind} ${e.id}`);
  const cur = followSel.value;
  followSel.innerHTML = '<option value="">— all —</option>';
  for (const [id, label] of [...seen.entries()].sort((a, b) => a[0] - b[0])) {
    const o = document.createElement('option');
    o.value = String(id);
    o.textContent = `${label} (#${id})`;
    followSel.appendChild(o);
  }
  followSel.value = cur;
}

document.getElementById('file').addEventListener('change', async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  const text = await f.text();
  frames = [];
  events = [];
  trails.clear();
  for (const line of text.split('\n')) {
    const s = line.trim();
    if (!s) continue;
    try {
      const rec = JSON.parse(s);
      const m = rec.msg;
      if (m.t === 'snapshot') frames.push({ t: rec.t, entities: m.entities });
      else if (m.t === 'welcome') frames.push({ t: rec.t, entities: m.snapshot });
      else if (m.t === 'chat') events.push({ t: rec.t, frameIdx: frames.length, text: `${m.from}: ${m.text}` });
      else if (m.t === 'event') events.push({ t: rec.t, frameIdx: frames.length, text: `event:${m.kind} ${JSON.stringify(m.payload ?? {}).slice(0, 80)}` });
    } catch { /* skip bad line */ }
  }
  frames.sort((a, b) => a.t - b.t);
  for (const fr of frames) for (const e of fr.entities) pushTrail(e);
  scrub.max = Math.max(0, frames.length - 1);
  idx = 0;
  pause();
  refreshFollowOptions();
  draw(0);
});

function baseInterval() { return 100 / Number(speedSel.value || 1); }
function step(dir) {
  idx += dir;
  if (idx >= frames.length) {
    if (loopBox.checked) idx = 0;
    else { idx = frames.length - 1; pause(); return; }
  }
  if (idx < 0) idx = 0;
  draw(idx);
}
function play() {
  if (!frames.length || playing) return;
  playing = true;
  timer = setInterval(() => step(1), baseInterval());
  document.getElementById('play').textContent = 'pause';
}
function pause() {
  playing = false;
  if (timer) clearInterval(timer);
  timer = null;
  document.getElementById('play').textContent = 'play';
}
function toggle() { if (playing) pause(); else play(); }
document.getElementById('play').addEventListener('click', toggle);
document.getElementById('stepB').addEventListener('click', () => { pause(); step(-1); });
document.getElementById('stepF').addEventListener('click', () => { pause(); step(1); });
speedSel.addEventListener('change', () => { if (playing) { pause(); play(); } });
followSel.addEventListener('change', () => draw(idx));
scrub.addEventListener('input', () => { pause(); idx = Number(scrub.value); draw(idx); });
document.addEventListener('keydown', (ev) => {
  if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT')) {
    if (ev.target === document.body || ev.target === scrub) { /* fall through for space */ }
    else if (ev.code !== 'Space') return;
    else return; // don't hijack typing in file input
  }
  if (ev.code === 'Space') { ev.preventDefault(); toggle(); }
  else if (ev.code === 'ArrowRight') { pause(); step(1); }
  else if (ev.code === 'ArrowLeft') { pause(); step(-1); }
  else if (ev.code === 'Home') { pause(); idx = 0; draw(idx); }
  else if (ev.code === 'End') { pause(); idx = frames.length - 1; draw(idx); }
});
</script>
</body>
</html>
